name: Aktualizace dat nabíječek

on:
  schedule:
    - cron: "17 3 * * 1"  # každé pondělí 03:17 UTC (4:17/5:17 v ČR); ne v celou hodinu, tehdy GitHub běhy zdržuje
    - cron: "47 22 * * *" # každou noc 22:47 UTC (23:47/0:47 v ČR): zopakuje nepovedené stahování, jinak hned skončí (D26)
  workflow_dispatch: {}    # tlačítko „Run workflow“ (i z mobilní appky GitHub)
  push:
    branches: [main]
    paths: ["app/**", "tests/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read   # data OSM z minulého běhu (artefakt osm-raw, D24)

jobs:
  build-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GitHub's maximum: downloads may take 5.5 h (D26: OVERPASS_BUDGET_S), 30 min to save
    outputs:
      run: ${{ steps.need.outputs.run }}   # "no" = nightly run with nothing to repeat: no test, no deploy
    concurrency:   # one data download at a time; deploys of the app are not blocked by it (only deploy holds "pages")
      group: data
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: "1"   # the download log shows up live, also when a run is cancelled or times out
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the newest main when the job starts, not the commit from when a queued run was created
      - id: need
        name: Je co stahovat?
        # Monday run and a manual start always download; the nightly run only repeats a failed or cancelled download,
        # or one where a country got only data from the last run (meta.json osm_countries fresh: false) (D26)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "17 3 * * 1" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if python3 -c "import json, sys; m = json.load(open('app/data/meta.json')); sys.exit(0 if all(v.get('fresh') for v in m.get('osm_countries', {}).values()) else 1)"; then fresh=yes; else fresh=no; fi
          last=""
          # only data runs (push runs of the app would hide them), newest first
          api="repos/${{ github.repository }}/actions/workflows/update-data.yml/runs?status=completed&per_page=30"
          runs=$({ gh api "$api&event=schedule" --jq '.workflow_runs[] | "\(.created_at) \(.id)"' || true
                   gh api "$api&event=workflow_dispatch" --jq '.workflow_runs[] | "\(.created_at) \(.id)"' || true
                 } | sort -r | awk '{print $2}')
          for id in $runs; do
            last=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" \
                   --jq '.jobs[] | select(.name == "build-data") | .steps[] | select(.name == "Stáhnout data a postavit databázi") | .conclusion') || last=""
            if [ "$last" = "success" ] || [ "$last" = "failure" ] || [ "$last" = "cancelled" ]; then break; fi
          done
          echo "Poslední stahování: ${last:-žádné}; všechny státy čerstvé: $fresh"
          if [ "$last" != "success" ] || [ "$fresh" = "no" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"
          else echo "run=no" >> "$GITHUB_OUTPUT"; echo "Není co opakovat."; fi
      - uses: actions/setup-python@v5
        if: steps.need.outputs.run == 'yes'
        with:
          python-version: "3.12"
      - name: Data OSM z minulého běhu
        if: steps.need.outputs.run == 'yes'
        # a file that no Overpass server delivers is taken from here (D24); the first run has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/raw
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=osm-raw&per_page=30" \
                --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | .[-5:] | .[].id') || ids=""
          if [ -z "$ids" ]; then echo "Data OSM z minulého běhu nejsou."; exit 0; fi
          # oldest first: a newer artifact overwrites older files, a file missing in it is kept from an older one
          for id in $ids; do
            if gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "$RUNNER_TEMP/osm-raw.zip" \
               && unzip -o -q "$RUNNER_TEMP/osm-raw.zip" -d build/raw; then echo "Artefakt $id načten."; \
            else echo "Artefakt $id se nepodařilo načíst."; fi
          done
          ls -l build/raw
      - name: Stáhnout data a postavit databázi
        if: steps.need.outputs.run == 'yes'
        run: python3 build/build_db.py --refresh
      - uses: actions/upload-artifact@v4
        name: Uložit data OSM pro příští běh
        if: always() && steps.need.outputs.run == 'yes'   # also after a failed run: what was downloaded helps the next one
        continue-on-error: true   # a failed upload must not skip the export and saving of the new data
        with:
          name: osm-raw
          path: build/raw/osm_*.json
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true   # "Re-run" of the same run replaces it
      - name: Export pro appku
        if: steps.need.outputs.run == 'yes'
        run: python3 build/export_app.py
      - name: Uložit změny
        if: steps.need.outputs.run == 'yes'
        run: |
          git config user.name "nabijeci-planovac bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/data build/cache
          if git diff --cached --quiet; then echo "Beze změn"; exit 0; fi
          git commit -m "Data nabíječek $(date -u +%Y-%m-%d)"
          # others may push to main while the data downloads (R35): put the data commit on top, retry if main moves again
          for i in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 10
          done
          exit 1

  test:
    # the planner's rules (tests/): nothing is deployed unless they pass
    needs: [build-data]
    if: always() && (needs.build-data.result == 'success' || needs.build-data.result == 'skipped') && needs.build-data.outputs.run != 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.sha.outputs.sha }}   # the commit these tests passed on; deploy checks against it
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testy plánovače
        working-directory: tests
        run: npm ci --no-audit --no-fund && npm test

  deploy:
    needs: [test]
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    concurrency:   # GitHub Pages: one deploy at a time
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: same
        name: Je app/ na main ta otestovaná?
        # main can move between test and deploy (e.g. a data commit): deploy only the app/ the tests passed on;
        # a newer app/ is deployed by its own run after its tests (push of app/** or the data run)
        run: |
          git fetch -q --depth=1 origin "${{ needs.test.outputs.sha }}"
          if [ "$(git rev-parse HEAD:app)" = "$(git rev-parse "${{ needs.test.outputs.sha }}:app")" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "app/ se od otestovaného commitu změnila, nasadí ji běh toho commitu po svých testech."
          fi
      - uses: actions/configure-pages@v5
        if: steps.same.outputs.ok == '1'
      - uses: actions/upload-pages-artifact@v3
        if: steps.same.outputs.ok == '1'
        with:
          path: app
      - id: deployment
        if: steps.same.outputs.ok == '1'
        uses: actions/deploy-pages@v4
